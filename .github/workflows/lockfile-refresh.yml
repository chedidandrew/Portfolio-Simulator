name: Lockfile Refresh

on:
  push:
    branches:
      - ai/production-hardening-2026-08-22
    paths:
      - 'portfolio_growth_simulator/nextjs_space/package.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio_growth_simulator/nextjs_space
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai/production-hardening-2026-08-22
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock"
          git push origin HEAD:ai/production-hardening-2026-08-22
