name: Apply Guide Trigger Fix

on:
  push:
    branches:
      - ai/production-hardening-2026-08-22
    paths:
      - '.github/workflows/apply-guide-trigger-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai/production-hardening-2026-08-22
      - name: Use a native button for Guide collapsible triggers
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('portfolio_growth_simulator/nextjs_space/components/guide-tab.tsx')
          text = path.read_text()
          old = '''        <CollapsibleTrigger asChild>
          <CardHeader className={cn("cursor-pointer py-5 select-none", headerClassName)}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className={cn(
                  "p-2 rounded-lg transition-colors duration-300 shadow-sm",
                  iconWrapperClass
                )}>
                  <Icon className={cn("h-5 w-5", iconColorClass)} />
                </div>
                <div className="space-y-1 text-left">
                  <CardTitle className="text-lg leading-none text-foreground">{title}</CardTitle>
                  {description && <CardDescription>{description}</CardDescription>}
                </div>
              </div>
              <div className={cn(
                "p-1 rounded-full border transition-all duration-300",
                isOpen ? "bg-muted text-foreground rotate-180 shadow-inner" : "bg-transparent text-muted-foreground border-transparent group-hover:border-border"
              )}>
                <ChevronDown className="h-4 w-4" />
              </div>
            </div>
          </CardHeader>
        </CollapsibleTrigger>'''
          new = '''        <CollapsibleTrigger asChild>
          <button
            type="button"
            className={cn("flex w-full flex-col space-y-1.5 p-6 cursor-pointer py-5 select-none text-left", headerClassName)}
          >
            <span className="flex items-center justify-between">
              <span className="flex items-center gap-3">
                <span className={cn(
                  "p-2 rounded-lg transition-colors duration-300 shadow-sm",
                  iconWrapperClass
                )}>
                  <Icon className={cn("h-5 w-5", iconColorClass)} />
                </span>
                <span className="space-y-1 text-left">
                  <span className="block text-lg font-semibold leading-none tracking-tight text-foreground">{title}</span>
                  {description && <span className="block text-sm text-muted-foreground">{description}</span>}
                </span>
              </span>
              <span className={cn(
                "p-1 rounded-full border transition-all duration-300",
                isOpen ? "bg-muted text-foreground rotate-180 shadow-inner" : "bg-transparent text-muted-foreground border-transparent group-hover:border-border"
              )}>
                <ChevronDown className="h-4 w-4" />
              </span>
            </span>
          </button>
        </CollapsibleTrigger>'''
          if old not in text:
              raise SystemExit('GuideSection trigger block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio_growth_simulator/nextjs_space/components/guide-tab.tsx
          git commit -m "fix: use semantic guide collapsible triggers"
          git push origin HEAD:ai/production-hardening-2026-08-22
