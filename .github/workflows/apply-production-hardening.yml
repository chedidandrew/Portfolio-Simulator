name: Apply Production Hardening

on:
  push:
    branches:
      - ai/production-hardening-2026-08-22
    paths:
      - '.github/workflows/apply-production-hardening.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai/production-hardening-2026-08-22
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
      - name: Apply refactor and documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          app = root / 'portfolio_growth_simulator' / 'nextjs_space'

          def replace(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new))

          # Lazy-load the three large top-level application modes and stop remounting
          # the entire calculator tree when the display currency changes.
          page = app / 'app' / 'page.tsx'
          replace(page,
              "import { useState, useEffect, useRef } from 'react'\n",
              "import { useState, useEffect, useRef } from 'react'\nimport dynamic from 'next/dynamic'\n")
          replace(page,
              "import { GrowthMode } from '@/components/growth-mode'\nimport { WithdrawalMode } from '@/components/withdrawal-mode'\nimport { GuideTab } from '@/components/guide-tab'\n",
              "")
          marker = "import { subscribeRetirementPlanTransfer } from '@/lib/retirement-plan-transfer'\n"
          dynamic_block = marker + "\nconst GuideTab = dynamic(() => import('@/components/guide-tab').then((module) => module.GuideTab))\nconst GrowthMode = dynamic(() => import('@/components/growth-mode').then((module) => module.GrowthMode))\nconst WithdrawalMode = dynamic(() => import('@/components/withdrawal-mode').then((module) => module.WithdrawalMode))\n"
          replace(page, marker, dynamic_block)
          replace(page,
              "  const [currency, setCurrency] = useLocalStorage<string>('portfolio-sim-currency', 'USD')\n",
              "  const [currency, setCurrency] = useLocalStorage<string>('portfolio-sim-currency', 'USD')\n  const [currencyRevision, setCurrencyRevision] = useState(0)\n")
          replace(page,
              "  useEffect(() => {\n    setMounted(true)\n    setAppCurrency(currency)\n  }, []) // eslint-disable-line react-hooks/exhaustive-deps\n\n  useEffect(() => {\n    setAppCurrency(currency)\n  }, [currency])\n",
              "  useEffect(() => {\n    setMounted(true)\n  }, [])\n\n  useEffect(() => {\n    setAppCurrency(currency)\n    setCurrencyRevision((revision) => revision + 1)\n  }, [currency])\n")
          replace(page,
              "        <Tabs key={currency} value={activeTab} onValueChange={handleTabChange} className=\"w-full\">",
              "        <Tabs data-currency-revision={currencyRevision} value={activeTab} onValueChange={handleTabChange} className=\"w-full\">")

          # Keep useLocalStorage generic by making simulator validation explicit at call sites.
          growth = app / 'components' / 'growth-mode.tsx'
          replace(growth,
              "import { validateGrowthStateRange } from '@/lib/simulation/deterministic-validation'",
              "import { isValidGrowthState, validateGrowthStateRange } from '@/lib/simulation/deterministic-validation'")
          replace(growth,
              "      normalize: normalizeGrowthState,\n      shouldPersist:",
              "      normalize: normalizeGrowthState,\n      validatePersisted: isValidGrowthState,\n      shouldPersist:")

          withdrawal = app / 'components' / 'withdrawal-mode.tsx'
          replace(withdrawal,
              "import { validateWithdrawalStateRange } from '@/lib/simulation/deterministic-validation'",
              "import { isValidWithdrawalState, validateWithdrawalStateRange } from '@/lib/simulation/deterministic-validation'")
          replace(withdrawal,
              "      normalize: normalizeWithdrawalState,\n      shouldPersist:",
              "      normalize: normalizeWithdrawalState,\n      validatePersisted: isValidWithdrawalState,\n      shouldPersist:")

          # Pin browser-test tooling in the lockfile instead of installing it ad hoc in CI.
          package_path = app / 'package.json'
          package = json.loads(package_path.read_text())
          package['scripts']['test:browser:chromium'] = 'node scripts/browser-smoke.mjs'
          package['scripts']['test:browser:webkit'] = 'node scripts/browser-webkit-smoke.mjs'
          package['scripts']['test:browser:a11y'] = 'node scripts/browser-accessibility.mjs'
          package['devDependencies']['playwright'] = '1.62.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          (app / 'scripts' / 'browser-webkit-smoke.mjs').write_text(r'''import assert from 'node:assert/strict'
          import { webkit } from 'playwright'

          const baseUrl = process.env.BASE_URL || 'http://127.0.0.1:3000'
          const browser = await webkit.launch()

          try {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } })
            const page = await context.newPage()
            await page.goto(baseUrl, { waitUntil: 'networkidle' })
            await page.getByRole('tab', { name: 'Growth' }).click()

            const startingBalance = page.locator('#starting-balance')
            await startingBalance.fill('25000')
            await startingBalance.blur()
            await page.getByText('Projected Results').waitFor()

            const dimensions = await page.evaluate(() => ({
              viewport: document.documentElement.clientWidth,
              page: document.documentElement.scrollWidth,
            }))
            assert.ok(
              dimensions.page <= dimensions.viewport + 2,
              `Unexpected WebKit page-level horizontal overflow: ${dimensions.page}px > ${dimensions.viewport}px`,
            )

            await page.getByRole('button', { name: 'Open settings' }).click()
            await page.getByRole('menuitem', { name: 'Display Currency' }).click()
            const currencyDialog = page.getByRole('dialog', { name: 'Display Currency' })
            await currencyDialog.waitFor({ state: 'visible' })
            const dialogBox = await currencyDialog.boundingBox()
            assert.ok(dialogBox, 'Expected the WebKit currency dialog to be measurable.')
            assert.ok(dialogBox.x >= -1 && dialogBox.x + dialogBox.width <= 391)
            assert.ok(dialogBox.y >= -1 && dialogBox.y + dialogBox.height <= 845)
            await currencyDialog.getByRole('button', { name: 'Close dialog' }).click()

            console.log('WebKit browser smoke tests passed.')
            await context.close()
          } finally {
            await browser.close()
          }
          '''.replace('          ', ''))

          (app / 'scripts' / 'browser-accessibility.mjs').write_text(r'''import assert from 'node:assert/strict'
          import axe from 'axe-core'
          import { chromium } from 'playwright'

          const baseUrl = process.env.BASE_URL || 'http://127.0.0.1:3000'
          const browser = await chromium.launch()

          try {
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } })
            const page = await context.newPage()

            for (const path of ['/', '/methodology']) {
              await page.goto(`${baseUrl}${path}`, { waitUntil: 'networkidle' })
              await page.addScriptTag({ content: axe.source })
              const report = await page.evaluate(async () => window.axe.run(document.body))
              const blockers = report.violations.filter((violation) =>
                violation.impact === 'serious' || violation.impact === 'critical'
              )
              assert.deepEqual(
                blockers.map((violation) => violation.id),
                [],
                `Serious or critical accessibility violations on ${path}`,
              )
            }

            console.log('Real-browser accessibility checks passed.')
            await context.close()
          } finally {
            await browser.close()
          }
          '''.replace('          ', ''))

          # Make the normal CI command the single source of truth.
          (root / '.github' / 'workflows' / 'web-ci.yml').write_text('''name: Website CI

          on:
            workflow_dispatch:
            push:
              branches:
                - main
              paths:
                - 'portfolio_growth_simulator/nextjs_space/**'
                - '.github/workflows/web-ci.yml'
            pull_request:
              paths:
                - 'portfolio_growth_simulator/nextjs_space/**'
                - '.github/workflows/web-ci.yml'

          permissions:
            contents: read

          concurrency:
            group: website-ci-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              defaults:
                run:
                  working-directory: portfolio_growth_simulator/nextjs_space
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v7
                  with:
                    node-version: '24.x'
                    cache: npm
                    cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
                - run: npm ci
                - run: npm run verify
          '''.replace('          ', ''))

          (root / '.github' / 'workflows' / 'browser-smoke.yml').write_text('''name: Browser Smoke

          on:
            workflow_dispatch:
            pull_request:
              paths:
                - 'portfolio_growth_simulator/nextjs_space/**'
                - '.github/workflows/browser-smoke.yml'
            push:
              branches:
                - main
              paths:
                - 'portfolio_growth_simulator/nextjs_space/**'
                - '.github/workflows/browser-smoke.yml'
            schedule:
              - cron: '37 7 * * 1'

          permissions:
            contents: read

          concurrency:
            group: browser-smoke-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            chromium:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              defaults:
                run:
                  working-directory: portfolio_growth_simulator/nextjs_space
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v7
                  with:
                    node-version: '24.x'
                    cache: npm
                    cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - run: npm run build
                - name: Start application
                  run: |
                    npm start > /tmp/portfolio-simulator.log 2>&1 &
                    for attempt in $(seq 1 60); do
                      if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
                        exit 0
                      fi
                      sleep 2
                    done
                    cat /tmp/portfolio-simulator.log
                    exit 1
                - run: npm run test:browser:chromium
                - run: npm run test:browser:a11y
                - name: Show server log on failure
                  if: failure()
                  run: cat /tmp/portfolio-simulator.log || true

            webkit:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              defaults:
                run:
                  working-directory: portfolio_growth_simulator/nextjs_space
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v7
                  with:
                    node-version: '24.x'
                    cache: npm
                    cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
                - run: npm ci
                - run: npx playwright install --with-deps webkit
                - run: npm run build
                - name: Start application
                  run: |
                    npm start > /tmp/portfolio-simulator-webkit.log 2>&1 &
                    for attempt in $(seq 1 60); do
                      if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
                        exit 0
                      fi
                      sleep 2
                    done
                    cat /tmp/portfolio-simulator-webkit.log
                    exit 1
                - run: npm run test:browser:webkit
                - name: Show server log on failure
                  if: failure()
                  run: cat /tmp/portfolio-simulator-webkit.log || true
          '''.replace('          ', ''))

          # Remove duplicate application-level license. The root BSD-3-Clause license remains authoritative.
          duplicate_license = app / 'LICENSE'
          if duplicate_license.exists():
              duplicate_license.unlink()

          (root / 'AGENTS.md').write_text('''# AI Development Rules

          This repository is maintained with AI-assisted development. These rules are mandatory for automated contributors.

          1. Never push application changes directly to `main`. Create a short-lived branch and pull request.
          2. Before merge, require the Website CI and Browser Smoke workflows to pass for the pull request.
          3. Run `npm run verify` for every application change. Browser-facing changes must also pass the Playwright smoke suite.
          4. Do not add user-visible features or content unless the task explicitly requests them.
          5. Preserve deterministic financial calculations and seeded Monte Carlo reproducibility. Any calculation change requires regression coverage.
          6. Update `CHANGELOG.md` and relevant documentation in the same pull request as the code change.
          7. Keep Vercel production deployment tied to the reviewed `main` branch. Merge only after checks are green.
          8. Do not weaken TypeScript, lint, security, accessibility, or test gates to make a change pass.
          9. Prefer small, reversible refactors and keep local-storage/share-link compatibility intact unless a migration is explicitly documented.

          The authoritative deployment procedure is in `docs/DEPLOYMENT.md`.
          '''.replace('          ', ''))

          docs = root / 'docs'
          docs.mkdir(exist_ok=True)
          (docs / 'DEPLOYMENT.md').write_text('''# Production Deployment

          Production is hosted by Vercel and connected to this GitHub repository. The production branch is `main`.

          ## Required workflow

          1. Create a short-lived branch for each change.
          2. Open a pull request into `main`.
          3. Wait for Website CI, Browser Smoke, and CodeQL to complete successfully.
          4. Merge the pull request only after the required checks are green.
          5. Vercel deploys the merged `main` commit to production through the existing Git integration.
          6. Verify the production URL and the merged commit after deployment.

          ## Repository protection

          GitHub repository settings should protect `main` against force pushes and direct application pushes, and should require the Website CI and Browser Smoke status checks before merge. The repository-level `AGENTS.md` also instructs automated contributors to use this PR-first workflow.

          Branch protection is a GitHub repository setting rather than source code. If repository administration tooling is unavailable, the PR-first process must still be followed and the protection setting should be enabled from GitHub Settings as soon as administrative access is available.

          ## Local validation

          From `portfolio_growth_simulator/nextjs_space`:

          ```bash
          npm ci
          npm run verify
          ```

          Browser smoke tests are executed by GitHub Actions on pull requests. Playwright is pinned in `devDependencies` so CI uses the lockfile rather than an ad hoc package install.
          '''.replace('          ', ''))

          (root / 'CHANGELOG.md').write_text('''# Changelog

          All notable repository and production changes are documented here.

          ## 2026-08-22 - Production hardening and maintainability

          ### Changed
          - Enabled the existing System theme option in `next-themes`.
          - Restored the default Next.js image optimization pipeline.
          - Lazy-loaded Guide, Growth, and Withdrawal top-level mode bundles.
          - Removed currency-driven remounting of the entire calculator tree while preserving immediate display-currency refreshes.
          - Made `useLocalStorage` generic by moving Growth and Withdrawal state validation to their explicit call sites.
          - Consolidated Website CI around the single `npm run verify` source of truth.
          - Pinned Playwright in `devDependencies` and removed the unlocked runtime install from browser CI.
          - Added a WebKit mobile smoke pass and real-browser Axe accessibility checks, including color contrast.
          - Scoped browser-smoke concurrency by Git ref so unrelated branches do not cancel each other.
          - Removed the duplicate nested license file; the root BSD-3-Clause license remains authoritative.

          ### Process
          - Added `AGENTS.md` with mandatory AI development and documentation rules.
          - Added `docs/DEPLOYMENT.md` documenting the PR-first GitHub-to-Vercel production workflow and branch-protection requirements.
          - Retained the existing application directory layout because the current Vercel project is configured around it; moving the app root without host configuration access would create avoidable production risk.
          '''.replace('          ', ''))

          readme = root / 'README.md'
          text = readme.read_text()
          text = text.replace(
              'The verification command runs linting, financial and regression tests, rendered component tests, TypeScript checking, and the production build. GitHub Actions runs the same checks after website changes are pushed to `main`, for pull requests, and on manual dispatch. A separate browser smoke workflow exercises downloads, Monte Carlo Web Workers, shared links, and a mobile viewport in Chromium.',
              'The verification command runs linting, financial and regression tests, rendered component tests, TypeScript checking, and the production build. GitHub Actions calls this same command for website pull requests and `main`. A separate browser smoke workflow exercises downloads, Monte Carlo Web Workers, shared links, mobile layout in Chromium and WebKit, and real-browser accessibility checks.'
          )
          text = text.replace(
              'The production website is deployed through Vercel from the `main` branch.',
              'The production website is deployed through Vercel from the `main` branch. Application changes should reach `main` only through a pull request after Website CI, Browser Smoke, and CodeQL are green. See `docs/DEPLOYMENT.md` and `AGENTS.md` for the maintained production workflow.'
          )
          text = text.replace(
              '├── .github/workflows/                 # GitHub validation workflow',
              '├── .github/workflows/                 # GitHub validation and browser workflows'
          )
          text = text.replace(
              '├── LICENSE\n└── README.md',
              '├── docs/DEPLOYMENT.md                 # Production release process\n├── AGENTS.md                          # Rules for AI-assisted development\n├── CHANGELOG.md                       # Repository change history\n├── LICENSE\n└── README.md'
          )
          readme.write_text(text)

          # One-shot helper workflows are removed from the resulting branch.
          for helper in [
              root / '.github' / 'workflows' / 'apply-production-hardening.yml',
              root / '.github' / 'workflows' / 'lockfile-refresh.yml',
          ]:
              if helper.exists():
                  helper.unlink()
          PY

          cd portfolio_growth_simulator/nextjs_space
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run verify
          cd ../..

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: harden production workflow and client architecture"
          git push origin HEAD:ai/production-hardening-2026-08-22
