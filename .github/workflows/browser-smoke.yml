name: Browser Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'portfolio_growth_simulator/nextjs_space/**'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'portfolio_growth_simulator/nextjs_space/**'
      - '.github/workflows/browser-smoke.yml'
  schedule:
    - cron: '37 7 * * 1'

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portfolio_growth_simulator/nextjs_space
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/portfolio-simulator.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-simulator.log
          exit 1
      - run: npm run test:browser:chromium
      - run: npm run test:browser:loan
      - run: npm run test:browser:a11y
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/portfolio-simulator.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portfolio_growth_simulator/nextjs_space
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/portfolio-simulator-webkit.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-simulator-webkit.log
          exit 1
      - run: npm run test:browser:webkit
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/portfolio-simulator-webkit.log || true
