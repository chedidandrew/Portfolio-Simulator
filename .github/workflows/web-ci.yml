name: Website CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'portfolio_growth_simulator/nextjs_space/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'portfolio_growth_simulator/nextjs_space/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portfolio_growth_simulator/nextjs_space
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: portfolio_growth_simulator/nextjs_space/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
