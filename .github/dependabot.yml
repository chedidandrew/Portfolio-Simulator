version: 2
updates:
  - package-ecosystem: npm
    directory: /portfolio_growth_simulator/nextjs_space
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      framework-dependencies:
        dependency-type: production
        patterns:
          - next
          - react
          - react-dom
          - next-themes
        update-types:
          - minor
          - patch
      radix-ui-dependencies:
        dependency-type: production
        patterns:
          - "@radix-ui/*"
        update-types:
          - minor
          - patch
      ui-utility-dependencies:
        dependency-type: production
        patterns:
          - class-variance-authority
          - katex
          - lucide-react
          - sonner
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
